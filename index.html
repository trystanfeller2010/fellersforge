function getTodayId(){return["sunday","monday","tuesday","wednesday","thursday","friday","saturday"][new Date().getDay()];}
function getWeekKey(){const n=new Date(),s=new Date(n);s.setDate(n.getDate()-n.getDay());return`wk_${s.toISOString().split("T")[0]}`;}
function getTodayKey(){return`day_${new Date().toISOString().split("T")[0]}`;}
function formatDate(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});}
function usePersist(k,i){const[v,s]=useState(()=>{try{const x=localStorage.getItem(k);return x?JSON.parse(x):i;}catch{return i;}});useEffect(()=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{};},[k,v]);return[v,s];}

// Get first upcoming Monday
function getFirstMonday(){
  const today=new Date();
  const day=today.getDay();
  const diff=day===1?0:day===0?1:8-day;
  const mon=new Date(today);
  mon.setDate(today.getDate()+diff);
  mon.setHours(0,0,0,0);
  return mon;
}

function MacroBar({label,current,target,color,unit}){

  return(
    <div style={{marginBottom:13}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
        <span style={{fontSize:12,color:"#94A3B8",fontWeight:600}}>{label}</span>

      <div style={{background:"rgba(255,255,255,0.06)",borderRadius:5,height:6,overflow:"hidden"}}>
        <div style={{height:"100%",borderRadius:5,width:`${pct}%`,background:over?`linear-gradient(90deg,${color},#EF4444)`:color,boxShadow:`0 0 7px ${color}44`,transition:"width 0.7s cubic-bezier(.4,0,.2,1)"}}/>
      </div>
    </div>
  );
}

/* ─── WEIGHT CHART ──────────────────────────────────────────────── */
function WeightChart({data,color}){
  const h=110,pad=14,w=320;
  const vals=data.map(d=>d.weight);
  const mn=Math.min(...vals)-2,mx=Math.max(...vals)+2;
  const pts=data.map((d,i)=>({x:pad+(i/(data.length-1||1))*(w-pad*2),y:h-pad-((d.weight-mn)/(mx-mn||1))*(h-pad*2)}));
  const path=pts.map((p,i)=>i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`).join(" ");
  const area=`${path} L${pts[pts.length-1].x},${h} L${pts[0].x},${h} Z`;
  return(
    <svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height:"auto"}}>
      <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.3"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
      <path d={area} fill="url(#wg)"/>
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{filter:`drop-shadow(0 0 5px ${color}77)`}}/>
      {pts.map((p,i)=>(
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="4" fill={color} style={{filter:`drop-shadow(0 0 4px ${color})`}}/>
          <text x={p.x} y={h-1} textAnchor="middle" fontSize="9" fill="#334155" fontFamily="Plus Jakarta Sans,sans-serif">{data[i].dateLabel?.split(" ")[1]||""}</text>
        </g>
      ))}
    </svg>
  );
}
